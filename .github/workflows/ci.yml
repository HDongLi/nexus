# CI runs the same gate scripts a developer runs. Nothing here is CI-only logic
# (charter P8: the machine is the judge, and it judges by the same rules locally and here).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    name: "L0-L2 · Node ${{ matrix.node }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The scope gate compares against the base branch, which has to be present.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --global pnpm@12.23.0
      - run: pnpm install --frozen-lockfile

      # A pull request is checked out as a merge commit with no branch name, so the task id and
      # the base branch are passed by hand. A branch that is not a task branch is skipped by the gate.
      - name: Task scope (pull requests)
        if: github.event_name == 'pull_request'
        run: node tools/gates/scope.ts --task "${{ github.head_ref }}" --base "origin/${{ github.base_ref }}"

      - run: node tools/gates/l0.ts
      - run: node tools/gates/l1.ts
      # With DATABASE_URL set, the migration replay runs on the real Postgres service.
      - run: node tools/gates/l2.ts
        env:
          DATABASE_URL: postgres://nexus:nexus@127.0.0.1:5432/nexus

  e2e:
    name: "L3 · 端到端 · Node 24"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@12.23.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexus/web exec playwright install --with-deps chromium
      - run: node tools/gates/l3.ts
